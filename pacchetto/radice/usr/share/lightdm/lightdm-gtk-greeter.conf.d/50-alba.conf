[greeter]
background=/usr/share/backgrounds/alba/alba.png
theme-name=Arc-Dark
icon-theme-name=Papirus-Dark
font-name=Noto Sans 11
default-user-image=/usr/share/icons/hicolor/scalable/apps/alba-logo.svg
position=50%,center 50%,center
clock-format=%H:%M  ·  %A %d %B
indicators=~host;~spacer;~clock;~spacer;~layout;~language;~a11y;~power
user-background=false
hide-user-image=false
round-user-image=true
