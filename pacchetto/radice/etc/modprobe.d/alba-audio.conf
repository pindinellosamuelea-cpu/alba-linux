# Alba Linux: audio sempre pronto.
# Il risparmio energetico della scheda audio la "addormenta" dopo pochi
# secondi di silenzio: al risveglio il microfono perde le prime parole (e le
# casse fanno un piccolo "toc"). Lo teniamo sveglio: il consumo è minimo.
options snd_hda_intel power_save=0 power_save_controller=N
