# Alba Linux: grafica senza sfarfallii e senza "strappi"
# Intel: il risparmio energetico dello schermo (PSR) su molti portatili
# provoca sfarfallio e piccoli difetti grafici: lo disattiviamo.
options i915 enable_psr=0
# NVIDIA (driver ufficiale): modalità moderna, avvio pulito e niente strappi
options nvidia-drm modeset=1 fbdev=1
options nvidia NVreg_PreserveVideoMemoryAllocations=1
