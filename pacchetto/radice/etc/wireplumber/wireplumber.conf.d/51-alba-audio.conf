# Alba Linux: microfono e casse non vanno mai "in pausa" (niente parole
# tagliate all'inizio quando si inizia a parlare, niente "toc" nelle casse).
monitor.alsa.rules = [
  {
    matches = [
      { node.name = "~alsa_input.*" }
      { node.name = "~alsa_output.*" }
    ]
    actions = {
      update-props = {
        session.suspend-timeout-seconds = 0
        node.pause-on-idle = false
      }
    }
  }
]

# Cuffie Bluetooth: microfono con qualità migliore (mSBC) quando disponibile
monitor.bluez.properties = {
  bluez5.enable-msbc = true
  bluez5.enable-hw-volume = true
  bluez5.roles = [ a2dp_sink a2dp_source bap_sink bap_source hsp_hs hfp_hf hfp_ag ]
}
