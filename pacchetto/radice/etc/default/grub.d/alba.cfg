# Alba Linux: avvio diretto, senza menu e senza scritte.
# Per vedere il menu (es. per scegliere Windows) tieni premuto Esc
# mentre il computer si accende.
GRUB_DISTRIBUTOR="Alba"
GRUB_TIMEOUT=0
GRUB_TIMEOUT_STYLE=hidden
GRUB_CMDLINE_LINUX_DEFAULT="quiet splash loglevel=3 rd.udev.log_level=3 vt.global_cursor_default=0"
GRUB_DISABLE_OS_PROBER=false
GRUB_GFXPAYLOAD_LINUX=keep
# Sfondo uguale alla schermata di avvio di Alba (niente immagine di Debian)
GRUB_BACKGROUND="/usr/share/alba/grub-sfondo.png"
