# Costruisce l'ISO di Alba Linux sui server di GitHub: non serve un PC Linux.
# Avvio: scheda "Actions" del repository -> "Costruisci ISO Alba" -> "Run workflow".
# Al termine (circa 1 ora) l'ISO si scarica dalla sezione "Artifacts".
name: Costruisci ISO Alba

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  iso:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - name: Libera spazio sul disco
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune --all --force
          df -h /

      - name: Scarica il progetto
        uses: actions/checkout@v4

      - name: Costruisci l'ISO
        run: sudo ./build.sh

      - name: Pubblica l'ISO
        uses: actions/upload-artifact@v4
        with:
          name: alba-linux-iso
          path: |
            alba-linux*.iso
            alba-linux*.iso.sha256
          compression-level: 0
          retention-days: 14

      - name: Registro di costruzione
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: registro-build
          path: build.log
          if-no-files-found: ignore
